name: Phase 7 Plexamp runtime ordering fix

on:
  push:
    branches: [feature/alarm-engine]
    paths:
      - .github/workflows/phase7-plexamp-runtime-order-fix.yml

permissions:
  contents: write

jobs:
  apply-fix:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: feature/alarm-engine
          fetch-depth: 0

      - name: Apply exact source rewrite
        run: python3 scripts/ci/apply_phase7_plexamp_runtime_order_fix.py

      - name: Validate focused change
        run: |
          git diff --check
          bash -n scripts/install-plexamp-runtime.sh
          python3 -m unittest tests.test_plexamp_runtime_installer -v

      - name: Commit corrected runtime ordering
        run: |
          git rm .github/workflows/phase7-plexamp-runtime-order-fix.yml
          git rm scripts/ci/apply_phase7_plexamp_runtime_order_fix.py
          git config user.name "A Clockwork Plex CI"
          git config user.email "actions@users.noreply.github.com"
          git add scripts/install-plexamp-runtime.sh tests/test_plexamp_runtime_installer.py
          git commit -m "fix: verify Plexamp unit after fresh runtime promotion"
          git push origin HEAD:feature/alarm-engine
