name: CamillaDSP Artifact Probe

on:
  push:
    branches:
      - feature/alarm-engine
    paths:
      - .github/workflows/camilladsp-artifact-probe.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Verify official CamillaDSP 4.1.3 aarch64 asset
        shell: bash
        run: |
          set -euo pipefail
          url='https://github.com/HEnquist/camilladsp/releases/download/v4.1.3/camilladsp-linux-aarch64.tar.gz'
          archive="$RUNNER_TEMP/camilladsp-linux-aarch64.tar.gz"
          extract="$RUNNER_TEMP/camilla"
          mkdir -p "$extract"
          curl --fail --show-error --silent --location --proto '=https' --tlsv1.2 --output "$archive" "$url"
          printf 'CAMILLA_ARCHIVE_SHA256=%s\n' "$(sha256sum "$archive" | awk '{print $1}')"
          tar -xzf "$archive" -C "$extract"
          test -f "$extract/camilladsp"
          chmod +x "$extract/camilladsp"
          printf 'CAMILLA_BINARY_SHA256=%s\n' "$(sha256sum "$extract/camilladsp" | awk '{print $1}')"
          printf 'CAMILLA_VERSION=%s\n' "$("$extract/camilladsp" --version 2>&1 | head -n1)"
          test "$(sha256sum "$archive" | awk '{print $1}')" = 'd9a17092923ebfe5d20a770c6b6a7eb2268f9700f999bf604b9db09f518aca5a'
          test "$(sha256sum "$extract/camilladsp" | awk '{print $1}')" = 'e04c7a6603e9482bab33c1e18afc41d3c07410b54ba9c246eda69f7e9cbaedfa'
          "$extract/camilladsp" --version 2>&1 | grep -Fq '4.1.3'
          echo 'CAMILLA_ARTIFACT_PROBE=PASS'
