name: Record Phase 7 execution sequence

on:
  push:
    branches:
      - feature/alarm-engine
    paths:
      - .github/workflows/record-phase7-next-steps.yml
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/record-phase7-next-steps.yml

permissions:
  contents: write

jobs:
  record:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/alarm-engine
          fetch-depth: 0

      - name: Record remaining Phase 7 execution order
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('docs/eq-audio-installer-roadmap.md')
          text = path.read_text(encoding='utf-8')

          old_date = '**Last updated:** 20 August 2026  '
          new_date = '**Last updated:** 21 August 2026  '
          if text.count(old_date) != 1:
              raise SystemExit(f'Expected one roadmap date marker; found {text.count(old_date)}')
          text = text.replace(old_date, new_date, 1)

          anchor = '#### Final repository/release hygiene — classification started; broad destructive cleanup waits for clean-room proof\n'
          if text.count(anchor) != 1:
              raise SystemExit(f'Expected one release-hygiene anchor; found {text.count(anchor)}')

          sequence = '''#### Remaining Phase 7 execution sequence — authoritative order\n\n1. [ ] **Finish tracked runtime/generated-state + `.gitignore` audit.** Confirm all normal runtime/cache/log/build/editor artefacts are ignored, no generated appliance state is tracked, and record/remediate any gaps. Obsolete completed-stage automation may be removed when its lack of release/runtime ownership is proven.\n2. [ ] **Audit and pin fresh-install repository dependencies.** Trace every repository file required by `setup.sh` and `appliance-installer.sh` (including delegated scripts/templates/configuration), ensure cleanup cannot remove a required dependency, and add/retain regression coverage for that contract where practical.\n3. [ ] **Refresh PR #2 description without changing its Draft/open state.** Replace the stale Stage-C/future-EQ narrative and obsolete test count with the actual release-candidate scope and remaining physical/release gates. Do not mark ready or merge without explicit owner approval.\n4. [ ] **Continue safe repository hygiene, but preserve uncertain provenance until clean-room proof.** Remove only clearly obsolete probes/scaffolding/generated leftovers now; deliberately defer broad historical-doc/archive deletion or any file whose release value is uncertain until the replacement-SD run proves the final dependency/evidence boundary. Remove temporary development refs before merge.\n5. [ ] **Run the replacement-SD release gate end-to-end.** Perform the public `setup.sh` clean-room install and commissioning, representative reboot, all three formal verifiers, repeat `setup.sh` idempotence proof, repeat verifiers, clean `git status --porcelain`, final evidence/documentation, final full validation and explicit owner approval before PR #2 can leave Draft or merge.\n\n'''
          marker = '#### Remaining Phase 7 execution sequence — authoritative order'
          if marker in text:
              raise SystemExit('Execution-sequence section already exists')
          text = text.replace(anchor, sequence + anchor, 1)
          path.write_text(text, encoding='utf-8')
          PY

      - name: Remove transient workflow and commit roadmap
        shell: bash
        run: |
          rm -f .github/workflows/record-phase7-next-steps.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/eq-audio-installer-roadmap.md .github/workflows/record-phase7-next-steps.yml
          git diff --cached --check
          git commit -m "docs: record remaining Phase 7 execution sequence"
          git push origin HEAD:feature/alarm-engine
