name: Apply EQ entry hardening v2

on:
  push:
    branches:
      - feature/alarm-engine

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/alarm-engine
          fetch-depth: 0

      - name: Apply idempotent hardening patch
        run: python3 scripts/dev/apply_eq_entry_hardening_v2.py

      - name: Validate patched shell and Python syntax
        shell: bash
        run: |
          bash -n scripts/audio/install-eq.sh scripts/audio/repair-audio.sh scripts/audio/verify-audio.sh scripts/audio/uninstall-eq.sh
          python3 -m py_compile scripts/a-clockwork-plex-audio-eq.py scripts/a-clockwork-plex-audio-route.py

      - name: Commit hardening patch
        shell: bash
        run: |
          rm -f \
            .github/workflows/apply-eq-entry-hardening.yml \
            .github/workflows/apply-eq-entry-hardening-v2.yml \
            scripts/dev/apply_eq_entry_hardening_v2.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            printf 'No patch changes were required.\n'
          else
            git commit -m "Complete EQ entry rollback and verification hardening"
            git push origin HEAD:feature/alarm-engine
          fi
