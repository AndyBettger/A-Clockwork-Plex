name: Finalize checkpoint 55 roadmap closure

on:
  push:
    branches:
      - feature/alarm-engine
    paths:
      - .github/workflows/finalize-checkpoint-55-roadmap.yml

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/alarm-engine
          fetch-depth: 0

      - name: Close checkpoint 55 and retain forecast-location UX follow-up
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('docs/eq-audio-installer-roadmap.md')
          text = path.read_text(encoding='utf-8')

          replacements = {
              "### Phase 7 — full appliance installer integration — **In progress: functional/audio/Weather/annunciator/V3 and main presentation are physically accepted; final Weather timing-control re-check, replacement-SD clean-room install, formal verifiers and release hygiene remain**":
              "### Phase 7 — full appliance installer integration — **In progress: functional/audio/Weather/annunciator/V3, presentation and Settings-control acceptance are physically complete; replacement-SD clean-room install, formal verifiers and release hygiene remain**",

              "#### Settings numeric-control + semantic palette closure follow-up — palette/persistence and initial presets physical PASS; Weather timing closure re-check pending":
              "#### Settings numeric-control + semantic palette closure follow-up — physical PASS",

              "- [ ] **Physical #55 Weather timing-control re-check:** confirm Weather > Station Freshness window, Poll interval, Stale after and Request timeout are true dropdowns and touching them does not summon the number keyboard. Confirm Online forecast latitude/longitude have no native spinner arrows; the custom decimal keyboard remains expected when deliberately editing those exact coordinate fields. Change/reload one harmless timing value to reconfirm persistence.":
              "- [x] **Physical #55 Weather timing-control re-check, 20 August — PASS:** Weather > Station Freshness window, Poll interval, Stale after and Request timeout all render as true dropdowns on the real appliance. Online forecast latitude/longitude are spinner-free exact-entry text fields. The owner explicitly accepted the completed #55 control set as a full physical pass.",

              "- [ ] Main presentation, palette closure and the initial touch presets are accepted on the current appliance; one narrow Weather Station timing-control ergonomics re-check remains. Final release evidence still waits for the replacement spare SD because the present test card is not trustworthy clean-room media.":
              "- [x] Main presentation, palette closure and Settings touch-control ergonomics are accepted on the current appliance through checkpoint #55. Final release evidence still waits for the replacement spare SD because the present test card is not trustworthy clean-room media.",

              "- **#55 — complete Weather timing-control touch closure — SOURCE/CI PASS; FOCUSED PI PHYSICAL RE-CHECK PENDING.** Ecowitt Freshness window plus WU Poll interval, Stale after and Request timeout are now true `<select>` controls with useful bounded presets and preservation of existing non-preset values. Forecast latitude/longitude remain exact-entry controls but are forced to text/custom-decimal-keyboard ownership, removing native Chromium up/down spinner arrows. The numeric-control asset is cache-busted to `numeric-controls-v3`, and regression coverage rejects reintroduction of native number inputs for these controls. Exact source/test head `e786c1c653083f6de9c0b1daf1a87ab975b55f25` passed Tests #3984 / run `32425069018`: Python compile PASS, JavaScript/page wiring PASS, shell syntax PASS and **1,753/1,753 unit tests PASS**. Only the focused physical check of the four Weather timing dropdowns/no keyboard, spinner-free forecast coordinates and persistence remains.":
              "- **#55 — complete Weather timing-control touch closure — PASS (source/CI + physical).** Ecowitt Freshness window plus WU Poll interval, Stale after and Request timeout are true `<select>` controls with useful bounded presets and preservation of existing non-preset values. Forecast latitude/longitude remain exact-entry controls but use text/custom-decimal-keyboard ownership, removing native Chromium up/down spinner arrows. Exact source/test head `e786c1c653083f6de9c0b1daf1a87ab975b55f25` passed Tests #3984 / run `32425069018`: Python compile PASS, JavaScript/page wiring PASS, shell syntax PASS and **1,753/1,753 unit tests PASS**. **Physical 20 August:** all four remaining Weather timing controls rendered as dropdowns and forecast latitude/longitude were confirmed spinner-free; the owner explicitly accepted #55 as a full pass.",
          }

          for old, new in replacements.items():
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'Expected exactly one roadmap match, got {count}: {old[:90]}')
              text = text.replace(old, new, 1)

          anchor = "- [x] **Physical #55 Weather timing-control re-check, 20 August — PASS:** Weather > Station Freshness window, Poll interval, Stale after and Request timeout all render as true dropdowns on the real appliance. Online forecast latitude/longitude are spinner-free exact-entry text fields. The owner explicitly accepted the completed #55 control set as a full physical pass.\n"
          followup = "\n#### Deferred Weather location-entry UX — recorded, non-blocking\n\n- [ ] **Friendly forecast-location entry:** replace coordinate-first commissioning as the normal experience with a friendly location lookup that resolves a place/postcode/location query to latitude/longitude and writes the same existing forecast-coordinate settings. Retain manual latitude/longitude as an advanced/fallback path for exact entry. This is deliberately recorded so the agreed UX improvement is not lost again; it is non-blocking for the current Phase 7 release unless explicitly promoted.\n"
          if followup.strip() in text:
              raise SystemExit('Deferred Weather location-entry UX section already present')
          if text.count(anchor) != 1:
              raise SystemExit('Could not locate #55 physical-pass anchor for UX follow-up')
          text = text.replace(anchor, anchor + followup, 1)

          path.write_text(text, encoding='utf-8')
          PY

      - name: Remove transient workflow and commit roadmap
        shell: bash
        run: |
          rm -f .github/workflows/finalize-checkpoint-55-roadmap.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/eq-audio-installer-roadmap.md .github/workflows/finalize-checkpoint-55-roadmap.yml
          git diff --cached --check
          git commit -m "docs: close checkpoint 55 and retain location UX follow-up"
          git push origin HEAD:feature/alarm-engine
