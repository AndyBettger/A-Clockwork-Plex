  <title>A Clockwork Plex shared 14-segment display cell</title>
  <desc>
    Editable source cell for the shared A Clockwork Plex 14-segment display.
    This is the selected Version 3 geometry. Edit the segment paths in Inkscape,
    then copy each segment path (and any transform) into SEGMENT_PATHS in
    app/static/js/segment-display.js. The runtime renderer is shared by the
    Clock, AirPlay and other dashboard segment readouts.
  </desc>
  <defs>
    <style><![CDATA[
      .guide {
        fill: none;
        stroke: #8fd3ff;
        stroke-opacity: 0.18;
        stroke-width: 0.18;
      }
      .segment {
        fill: rgba(143, 211, 255, 0.16);
        stroke: rgba(247, 249, 255, 0.35);
        stroke-width: 0.05;
      }
      .label {
        fill: #8fd3ff;
        font-family: DejaVu Sans, Arial, sans-serif;
        font-size: 1.1px;
        font-weight: 700;
      }
    ]]></style>
  </defs>
