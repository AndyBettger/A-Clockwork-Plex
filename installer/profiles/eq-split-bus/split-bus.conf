# A Clockwork Plex EQ-capable split-bus profile.
# Music occupies loopback channels 0/1; alarm occupies channels 2/3.
# Physically proven on plexamp-bedroom during the Stage A2 and Stage B rehearsals.

pcm.acp_dmix {
    type dmix
    ipc_key 1094934536
    ipc_key_add_uid false
    ipc_perm 0666
    slave {
        pcm "hw:7,0,0"
        format S16_LE
        rate 44100
        channels 4
        period_size 1024
        buffer_size 8192
    }
    bindings {
        0 0
        1 1
        2 2
        3 3
    }
}

pcm.acp_music_route {
    type route
    slave {
        pcm "acp_dmix"
        channels 4
    }
    ttable {
        0.0 1
        1.1 1
    }
}

pcm.acp_alarm_route {
    type route
    slave {
        pcm "acp_dmix"
        channels 4
    }
    ttable {
        0.2 1
        1.3 1
    }
}

pcm.acp_master_volume {
    type softvol
    slave.pcm "acp_music_route"
    control {
        name "A Clockwork Master"
        card "Pro"
    }
    min_dB -51.0
    max_dB 0.0
    resolution 256
}

pcm.acp_master {
    type plug
    slave.pcm "acp_master_volume"
    hint {
        show on
        description "A Clockwork Plex - Music master"
    }
}

pcm.acp_plexamp_volume {
    type softvol
    slave.pcm "acp_master"
    control {
        name "A Clockwork Plexamp"
        card "Pro"
    }
    min_dB -51.0
    max_dB 0.0
    resolution 256
}

pcm.acp_plexamp {
    type plug
    slave.pcm "acp_plexamp_volume"
    hint {
        show on
        description "A Clockwork Plex - Plexamp"
    }
}

pcm.acp_airplay_volume {
    type softvol
    slave.pcm "acp_master"
    control {
        name "A Clockwork AirPlay"
        card "Pro"
    }
    min_dB -51.0
    max_dB 0.0
    resolution 256
}

pcm.acp_airplay {
    type plug
    slave.pcm "acp_airplay_volume"
    hint {
        show on
        description "A Clockwork Plex - AirPlay"
    }
}

pcm.acp_alarm_volume {
    type softvol
    slave.pcm "acp_alarm_route"
    control {
        name "A Clockwork Alarm"
        card "Pro"
    }
    min_dB -51.0
    max_dB 0.0
    resolution 256
}

pcm.acp_alarm {
    type plug
    slave.pcm "acp_alarm_volume"
    hint {
        show on
        description "A Clockwork Plex - Independent alarm ceiling"
    }
}
